# Optional: a Databricks Asset Bundle that deploys the four notebooks as one
# scheduled job (bronze -> silver -> gold). See "Running it as a job" in the
# README. Without a cluster defined, the tasks run on serverless compute.

bundle:
  name: budget-buddy-lakehouse

variables:
  catalog:
    default: workspace
  schema:
    default: budget_buddy

resources:
  jobs:
    medallion:
      name: budget-buddy-medallion
      schedule:
        quartz_cron_expression: "0 30 6 * * ?"   # 06:30 every day
        timezone_id: Europe/London
        pause_status: PAUSED                      # switch on in the Jobs UI when ready
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/01_bronze.py
        - task_key: silver
          depends_on: [{ task_key: bronze }]
          notebook_task:
            notebook_path: ./notebooks/02_silver.py
        - task_key: gold
          depends_on: [{ task_key: silver }]
          notebook_task:
            notebook_path: ./notebooks/03_gold.py

targets:
  dev:
    mode: development
    default: true
